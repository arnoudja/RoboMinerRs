# cargo-deny: licenses + advisories (complements `cargo audit` in CI).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
targets = []

[advisories]
version = 2
yanked = "warn"
# Prefer upgrading; unmaintained crates are tracked as warnings for now.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
