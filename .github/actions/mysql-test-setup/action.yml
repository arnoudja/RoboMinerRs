name: MySQL/MariaDB test setup
description: Install a MySQL-compatible client and initialize RoboMiner schema for CI jobs.

runs:
  using: composite
  steps:
    - name: Install MySQL-compatible client
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y default-mysql-client

    - name: Initialize database schema
      shell: bash
      run: resources/scripts/init-ci-database.sh
