# fail2ban filter for RoboMiner failed login attempts.
#
# Prefer matching the stable application stderr / journal lines emitted by
# `log_auth_failure` (tracing default fmt), for example:
#   2026-09-04T12:00:00.123456Z  WARN robominer_web::rate_limit::auth: auth_failure ip=203.0.113.9 login_name=alice result=invalid_credentials
#   … auth_failure ip=203.0.113.9 login_name=alice result=rate_limited
#   … auth_failure ip=203.0.113.9 login_name=newuser result=signup_rejected
#
# Proxy access-log fallback matches only POST /login → 429 (not GET 200).
#
# Install:
#   sudo cp deploy/fail2ban/robominer-login.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/robominer-jail.conf /etc/fail2ban/jail.d/robominer.local
#   sudo systemctl reload fail2ban

[Definition]
failregex = ^.*?auth_failure ip=<HOST> login_name=\S+ result=(?:invalid_credentials|rate_limited|signup_rejected)\s*$
            ^<HOST> .+"(?:POST) /[Ll]ogin[^"]*" 429
ignoreregex =
