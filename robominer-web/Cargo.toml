[package]
name = "robominer-web"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
hmac = "0.12.1"
robominer-db = { workspace = true }
robominer-domain = { workspace = true }
serde_json = "1"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6.8", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
robominer-engine = { workspace = true }
robominer-test-support = { workspace = true }
serial_test = "3.2.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
