[workspace]
members = [
    "robominer-db",
    "robominer-domain",
    "robominer-engine",
    "robominer-optimize",
    "robominer-program",
    "robominer-sim",
    "robominer-test-support",
    "robominer-web",
]
resolver = "2"

[workspace.package]
version = "1.0.2"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
# Unifies with argon2's password-hash so SaltString::generate(OsRng) works.
password-hash = { version = "0.5", features = ["alloc", "rand_core", "getrandom"] }
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
hmac = "0.13.0"
rand = "0.10.2"
robominer-db = { path = "robominer-db" }
robominer-domain = { path = "robominer-domain" }
robominer-engine = { path = "robominer-engine" }
robominer-optimize = { path = "robominer-optimize" }
robominer-program = { path = "robominer-program" }
robominer-sim = { path = "robominer-sim" }
robominer-test-support = { path = "robominer-test-support" }
robominer-web = { path = "robominer-web" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serial_test = "4.0.1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "mysql", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["timeout"] }
thiserror = "2.0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
