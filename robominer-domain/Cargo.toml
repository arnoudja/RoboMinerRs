[package]
name = "robominer-domain"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
robominer-db = { workspace = true }
robominer-program = { workspace = true }
robominer-sim = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql"] }
tokio = { version = "1.48.0", features = ["rt"] }

[dev-dependencies]
robominer-test-support = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serial_test = "3.2.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
