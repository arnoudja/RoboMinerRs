[package]
name = "robominer-optimize"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "robominer-optimize"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.8.7"
robominer-db = { workspace = true }
robominer-domain = { workspace = true }
robominer-program = { workspace = true }
robominer-sim = { workspace = true }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
robominer-test-support = { workspace = true }

[lints]
workspace = true
